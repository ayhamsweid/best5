<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best5 | دليلك الشامل</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 font-sans antialiased text-gray-900">
    <div id="app-shell" aria-hidden="true">
      <header class="shell-header">
        <div class="shell-container">
          <div class="shell-logo">
            <span class="shell-logo-mark"></span>
            <div class="shell-logo-text">
              <div class="shell-title"></div>
              <div class="shell-subtitle"></div>
            </div>
          </div>
          <div class="shell-actions">
            <span class="shell-pill"></span>
            <span class="shell-pill"></span>
          </div>
        </div>
      </header>
      <main class="shell-main">
        <div class="shell-loader">
          <span class="shell-dot"></span>
          <span class="shell-dot"></span>
          <span class="shell-dot"></span>
        </div>
      </main>
      <footer class="shell-footer">
        <div class="shell-container">
          <div class="shell-footer-left">
            <div class="shell-footer-line"></div>
            <div class="shell-footer-line short"></div>
          </div>
          <div class="shell-footer-right">
            <div class="shell-footer-line"></div>
          </div>
        </div>
      </footer>
    </div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
