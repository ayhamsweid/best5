name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  code-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Audit and build frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: Audit, build, and test API
        working-directory: server
        run: |
          npm ci
          npm run prisma:generate
          npm audit --omit=dev --audit-level=high
          npm run test:security
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build images
        run: |
          docker build -t best5-api:ci ./server
          docker build --target renderer -t best5-renderer:ci .
          docker build --target web -t best5-web:ci .
      - name: Scan API image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v best5-trivy-cache:/root/.cache
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          best5-api:ci
      - name: Scan renderer image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v best5-trivy-cache:/root/.cache
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          best5-renderer:ci
      - name: Scan web image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v best5-trivy-cache:/root/.cache
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          best5-web:ci
